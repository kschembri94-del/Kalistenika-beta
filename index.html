<style>
  :root {
    --bg: #14181C;
    --panel: #1C2126;
    --panel-2: #232930;
    --panel-3: #2A3139;
    --line: #303840;
    --text: #ECE9E2;
    --text-dim: #93A0AB;
    --ok: #7FBF5F;
    --warn: #D9A441;
    --bad: #C1524C;
    --accent: #E7B44A;
    --progress: #4FA8D8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body { padding-bottom: 48px; }

  /* Gender gate */
  #genderGate {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; z-index: 100; padding: 24px;
  }
  #genderGate img { width: 84px; height: 84px; border-radius: 18px; }
  #genderGate h2 { margin: 0; font-size: 19px; font-weight: 700; text-align: center; }
  .gender-choices { display: flex; gap: 14px; }
  .gender-choices button {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-size: 15px; font-weight: 700; padding: 14px 28px; border-radius: 10px; cursor: pointer;
  }
  .gender-choices button:active { background: var(--panel-2); }

  header.top {
    padding: 22px 18px 14px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
  }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand-left { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.2px; }
  .gender-switch {
    background: var(--panel); border: 1px solid var(--line); color: var(--text-dim);
    font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 999px; cursor: pointer;
  }
  header.top .sub { color: var(--text-dim); font-size: 13px; margin-top: 6px; }

  nav.levels {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    position: sticky; top: 76px; z-index: 19; background: var(--bg);
    scrollbar-width: thin;
  }
  nav.levels button {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--panel);
    color: var(--text-dim); padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  nav.levels button .dot { width: 8px; height: 8px; border-radius: 50%; }
  nav.levels button.active { color: var(--text); border-color: var(--dotcolor, var(--accent)); background: var(--panel-2); }

  main { padding: 16px 18px 40px; max-width: 860px; margin: 0 auto; }

  .level-progress {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; color: var(--text-dim); font-size: 13px;
  }
  .level-progress b { color: var(--text); font-weight: 700; }
  .level-bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-bottom: 14px; }
  .level-bar > div { height: 100%; background: var(--accent); transition: width .3s ease; }

  .group-title { font-size: 12px; color: var(--text-dim); margin: 22px 0 8px; padding-left: 2px; }
  .group-title:first-of-type { margin-top: 4px; }

  .ex-row {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--rowcolor, var(--line));
    border-radius: 8px; margin-bottom: 8px; overflow: hidden;
  }
  .ex-main {
    display: grid; grid-template-columns: 30px 1fr auto;
    align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer;
  }
  .ex-icon {
    width: 26px; height: 26px; stroke: var(--text-dim); stroke-width: 6;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .ex-text { font-size: 14px; line-height: 1.3; }
  .ex-target { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
  .ex-target b { color: var(--text); font-weight: 600; }
  .assisted-best { color: var(--progress); }

  .status-pill {
    font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px;
    white-space: nowrap; min-width: 58px; text-align: center;
  }
  .status-pill.empty { background: var(--panel-2); color: var(--text-dim); }
  .status-pill.yes { background: rgba(127,191,95,0.18); color: var(--ok); }
  .status-pill.not-yet { background: rgba(217,164,65,0.18); color: var(--warn); }
  .status-pill.bad { background: rgba(193,82,76,0.18); color: var(--bad); }
  .status-pill.progress { background: rgba(79,168,216,0.18); color: var(--progress); }

  .ex-controls { display: flex; align-items: center; gap: 8px; }
  .ex-caret { color: var(--text-dim); font-size: 12px; transition: transform .15s ease; }
  .ex-row.open .ex-caret { transform: rotate(180deg); }

  .ex-more { display: none; padding: 4px 12px 14px 52px; }
  .ex-row.open .ex-more { display: block; }

  .log-form {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; margin-bottom: 10px;
  }
  .log-field { display: flex; flex-direction: column; gap: 3px; }
  .log-field label { font-size: 10.5px; color: var(--text-dim); }
  .log-field input {
    background: var(--panel-3); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 7px; font-size: 13px;
  }
  .log-field.value input { width: 64px; }
  .date-btn {
    background: var(--panel-3); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer;
    min-width: 108px; text-align: left;
  }
  .cal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .cal-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; width: 100%; max-width: 320px;
  }
  .cal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; font-weight: 700; font-size: 14px;
  }
  .cal-header button { background: none; border: none; color: var(--text); font-size: 20px; padding: 4px 12px; cursor: pointer; }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; color: var(--text-dim); font-size: 11px; margin-bottom: 6px;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 8px 0; font-size: 13px; cursor: pointer;
  }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.selected { background: var(--accent); color: #1C2126; font-weight: 700; }
  .cal-footer { display: flex; justify-content: space-between; margin-top: 12px; }
  .cal-today-btn, .cal-cancel-btn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    padding: 7px 12px; border-radius: 7px; font-size: 12px; cursor: pointer;
  }
  .log-field.notes { flex: 1; min-width: 120px; }
  .log-field.assisted { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; }
  .log-field.assisted input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .log-field.assisted label { margin: 0; font-size: 12.5px; color: var(--text); }
  .log-form button {
    background: var(--accent); border: none; color: #1C2126; font-weight: 700;
    font-size: 13px; padding: 7px 14px; border-radius: 6px; cursor: pointer;
  }

  .history-title { font-size: 11px; color: var(--text-dim); margin: 4px 0 6px; }
  .history-list { display: flex; flex-direction: column; gap: 6px; }
  .history-empty { font-size: 12.5px; color: var(--text-dim); padding: 4px 0; }
  .history-item {
    display: grid; grid-template-columns: 84px 62px 1fr auto;
    align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 9px; font-size: 12.5px;
  }
  .history-item .h-date { color: var(--text-dim); }
  .history-item .h-val { font-weight: 700; }
  .history-item .h-best { color: var(--ok); }
  .history-item .h-notes {
    color: var(--text-dim); overflow: hidden; min-width: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
  }
  .history-item .h-notes .h-notes-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-tag {
    background: rgba(217,164,65,0.18); color: var(--warn);
    font-size: 10.5px; font-weight: 700; padding: 2px 7px;
    border-radius: 999px; flex: 0 1 auto; white-space: normal; min-width: 0;
  }
  .history-item button {
    background: none; border: none; color: var(--text-dim);
    font-size: 14px; cursor: pointer; padding: 2px 4px;
  }
  .history-item button:hover { color: var(--bad); }

  footer.bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--panel); border-top: 1px solid var(--line);
    display: flex; gap: 6px; padding: 8px 10px; justify-content: center;
  }
  footer.bar button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text-dim);
    font-size: 11.5px; padding: 8px 8px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  footer.bar button:hover { color: var(--text); }
  #fileInput { display: none; }

  .beta-tag { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #14181C; background: #E3B341; padding: 2px 7px; border-radius: 999px; vertical-align: middle; margin-left: 6px; }
  .search-wrap { position: relative; padding: 10px 16px 0; }
  .search-wrap input { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-size: 15px; padding: 11px 38px 11px 14px; border-radius: 10px; outline: none; }
  .search-wrap input:focus { border-color: #5B9BD5; }
  .search-wrap input::-webkit-search-cancel-button { display: none; }
  .search-clear { position: absolute; right: 24px; top: 50%; transform: translateY(-35%); background: none; border: none; color: var(--text-dim); font-size: 16px; padding: 6px; cursor: pointer; display: none; }
  .search-wrap.has-text .search-clear { display: block; }
  .search-info { padding: 12px 16px 0; color: var(--text-dim); font-size: 14px; }
  .level-chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; margin-left: 6px; color: #14181C; vertical-align: middle; }
  .log-field.opt-select { flex: 1 1 100%; }
  .opt-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  .log-form .opt-buttons button {
    background: var(--panel-3); border: 1px solid var(--line); color: var(--text-dim);
    font-weight: 600; font-size: 12.5px; padding: 7px 11px; border-radius: 999px; text-align: left;
  }
  .log-form .opt-buttons button.active { background: var(--accent); color: #1C2126; border-color: var(--accent); }
  .opt-hint { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-top: 3px; }
  .opt-line { margin-top: 2px; }
  .opt-line .opt-mark { display: inline-block; width: 14px; color: var(--text-dim); }
  .opt-line.yes { color: var(--ok); }
  .opt-line.yes .opt-mark { color: var(--ok); }
  .opt-line.yes b { color: var(--ok); }
  .opt-line.progress .opt-mark { color: var(--progress); }
  .credit-note { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
</style>
</head>

const STORAGE_KEY = "kalistenika_beta_v1";
const OLD_STORAGE_KEY_V2 = "kalistenika_beta_unused_v2";
const OLD_STORAGE_KEY_V1 = "kalistenika_beta_unused_v1";
const GENDER_KEY = "kalistenika_beta_gender";

let state = {};
let gender = localStorage.getItem(GENDER_KEY) || null;

function migrateToV3() {
  // v2 (male-only, bare ids like "L1-1") -> prefix with "M-"
  try {
    const v2Raw = localStorage.getItem(OLD_STORAGE_KEY_V2);
    if (v2Raw) {
      const v2 = JSON.parse(v2Raw) || {};
      const out = {};
      Object.keys(v2).forEach(oldId => {
        out["M-" + oldId] = v2[oldId];
      });
      return out;
    }
  } catch (e) {}
  // v1 (single best/date/notes, male-only) -> history + prefix
  try {
    const v1Raw = localStorage.getItem(OLD_STORAGE_KEY_V1);
    if (v1Raw) {
      const v1 = JSON.parse(v1Raw) || {};
      const out = {};
      Object.keys(v1).forEach(oldId => {
        const o = v1[oldId];
        if (o && o.best !== "" && o.best !== undefined && o.best !== null) {
          out["M-" + oldId] = { history: [ { value: o.best, date: o.date || todayStr(), notes: o.notes || "" } ] };
        }
      });
      return out;
    }
  } catch (e) {}
  return {};
}

try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    state = JSON.parse(raw) || {};
  } else {
    state = migrateToV3();
    saveState();
  }
} catch (e) { state = {}; }

let currentLevel = 1;
let openRows = {};
let searchQuery = "";

function todayStr() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function todayParts() {
  const d = new Date();
  return { d: d.getDate(), m: d.getMonth() + 1, y: d.getFullYear() };
}

function partsToIso(day, month, year) {
  const dd = String(day).padStart(2, "0");
  const mm = String(month).padStart(2, "0");
  return year + "-" + mm + "-" + dd;
}

const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function daysInMonth(y, m) {
  return new Date(y, m, 0).getDate();
}
function firstWeekday(y, m) {
  return new Date(y, m - 1, 1).getDay();
}

function openCalendarPicker(y, m, d, onSelect) {
  let viewY = y, viewM = m;
  const overlay = document.createElement("div");
  overlay.className = "cal-overlay";
  const card = document.createElement("div");
  card.className = "cal-card";
  overlay.appendChild(card);

  function render() {
    card.innerHTML = "";

    const header = document.createElement("div");
    header.className = "cal-header";
    const prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.textContent = "\u2039";
    const label = document.createElement("span");
    label.textContent = MONTH_NAMES[viewM - 1] + " " + viewY;
    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.textContent = "\u203a";
    prevBtn.addEventListener("click", () => {
      viewM--; if (viewM < 1) { viewM = 12; viewY--; }
      render();
    });
    nextBtn.addEventListener("click", () => {
      viewM++; if (viewM > 12) { viewM = 1; viewY++; }
      render();
    });
    header.appendChild(prevBtn);
    header.appendChild(label);
    header.appendChild(nextBtn);
    card.appendChild(header);

    const weekRow = document.createElement("div");
    weekRow.className = "cal-weekdays";
    ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(w => {
      const el = document.createElement("span");
      el.textContent = w;
      weekRow.appendChild(el);
    });
    card.appendChild(weekRow);

    const grid = document.createElement("div");
    grid.className = "cal-grid";
    const firstWd = firstWeekday(viewY, viewM);
    const totalDays = daysInMonth(viewY, viewM);
    for (let i = 0; i < firstWd; i++) {
      grid.appendChild(document.createElement("span"));
    }
    const today = new Date();
    for (let day = 1; day <= totalDays; day++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "cal-day";
      btn.textContent = day;
      if (viewY === today.getFullYear() && viewM === today.getMonth() + 1 && day === today.getDate()) {
        btn.classList.add("today");
      }
      if (viewY === y && viewM === m && day === d) {
        btn.classList.add("selected");
      }
      btn.addEventListener("click", () => {
        onSelect(day, viewM, viewY);
        document.body.removeChild(overlay);
      });
      grid.appendChild(btn);
    }
    card.appendChild(grid);

    const footer = document.createElement("div");
    footer.className = "cal-footer";
    const todayBtn = document.createElement("button");
    todayBtn.type = "button";
    todayBtn.className = "cal-today-btn";
    todayBtn.textContent = "Today";
    todayBtn.addEventListener("click", () => {
      const t = new Date();
      onSelect(t.getDate(), t.getMonth() + 1, t.getFullYear());
      document.body.removeChild(overlay);
    });
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "cal-cancel-btn";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => {
      document.body.removeChild(overlay);
    });
    footer.appendChild(todayBtn);
    footer.appendChild(cancelBtn);
    card.appendChild(footer);
  }

  render();
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay) document.body.removeChild(overlay);
  });
  document.body.appendChild(overlay);
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getHistory(id) {
  return (state[id] && state[id].history) ? state[id].history : [];
}

function pretty(text) {
  // where the exercise name starts (after any leading "(" and quantity like "6", "20+", "1 min", "75% BW")
  const head = text.match(/^\s*\(?\s*(?:\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?\+?\s*(?:%\+?\s*BW|sec\+?|min\+?)?\s+)?/);
  const nameStart = head ? head[0].length : 0;
  const cap = (r, offset) => offset === nameStart ? r.charAt(0).toUpperCase() + r.slice(1) : r;
  return text.replace(
    /\bFree HSPUs?\b|\bBTW\b|\bCTW\b|\bHSPUs?\b|\bHS\b|\bOAPUs?\b|\bP\.?\s?bar\b|\bAdv\b|%\+?\s*BW\b|\bsec\b|\b\d+(?:\.\d+)?\s*min\b/gi,
    (m, offset) => {
      const u = m.toUpperCase().replace(/\s+/g, " ");
      const plural = /s$/i.test(m) ? "s" : "";
      if (/^FREE HSPU/.test(u)) return cap("freestanding handstand push-up" + plural, offset);
      if (u === "BTW") return cap("back-to-wall", offset);
      if (u === "CTW") return cap("chest-to-wall", offset);
      if (/^HSPU/.test(u)) return cap("handstand push-up" + plural, offset);
      if (u === "HS") return cap("handstand", offset);
      if (/^OAPU/.test(u)) return cap("one-arm pull-up" + plural, offset);
      if (/^P\.? ?BAR$/.test(u)) return cap("parallel bar", offset);
      if (u === "ADV") return cap("advanced", offset);
      if (/^%/.test(u)) return m.replace(/\s*BW$/i, " body weight");
      if (u === "SEC") return "seconds";
      const n = parseFloat(m);                       // "<n> min"
      return n + (n === 1 ? " minute" : " minutes");
    }
  );
}

function unitName(u, n) {
  if (u === "%BW") return "% body weight";
  if (u === "sec") return Number(n) === 1 ? "second" : "seconds";
  if (u === "reps") return Number(n) === 1 ? "rep" : "reps";
  return u || "";
}
function qty(n, u) {
  if (!u) return String(n);
  if (u === "%BW") return n + "% body weight";
  return n + " " + unitName(u, n);
}

// ---- Exercises with two options, e.g. "6 Pull ups / 15% BW Pull up" ----
// Each option is its own "slot" with its own goal and results. Either option
// completing its goal completes the exercise.
// ---- Same exercise across levels (e.g. Pull ups 3 / 6 / 10 reps) ----
// Slots are linked only when the wording matches exactly after removing the
// leading quantity ("6 Pull ups" -> "pull up"). Assisted/banded/negative
// variants and different units are never linked.
const KEY_OVERRIDES = { "M-L9-148": "90 degree hspu" };

function keyFromText(t) {
  t = t.replace(/^\s*\d+(?:\.\d+)?(?:\s*-\s*\d+(?:\.\d+)?)?\+?(?:\s*%\+?\s*BW|\s*sec\+?|\s*min\+?)?\s+/i, "");
  t = t.toLowerCase().replace(/-/g, " ").replace(/\bp\.?\s*bar\s+/g, "");
  t = t.split(/\s+/).map(w => (w.length >= 3 && /s$/.test(w) && !/ss$/.test(w)) ? w.slice(0, -1) : w).join(" ");
  return t.trim();
}

const FAMILIES = {};
EXERCISES.forEach(ex => {
  const opts = ex.options || [{ label: ex.text, target: ex.target, unit: ex.unit }];
  ex._slots = opts.map((o, i) => {
    const key = (!ex.options && KEY_OVERRIDES[ex.id]) ? KEY_OVERRIDES[ex.id] : keyFromText(o.label);
    const slot = { ex: ex, idx: i, label: o.label, target: o.target, unit: o.unit,
                   fam: ex.gender + "|" + (o.unit || "") + "|" + key };
    (FAMILIES[slot.fam] = FAMILIES[slot.fam] || []).push(slot);
    return slot;
  });
});

// Results for one option: its own entries first, then unassisted results logged
// on the same exercise at other levels.
function slotHistory(ex, idx) {
  const slot = ex._slots[idx];
  const own = getHistory(ex.id).filter(h => (h.opt || 0) === idx);
  const sibs = FAMILIES[slot.fam] || [];
  if (sibs.length < 2) return own;
  const out = own.slice();
  sibs.forEach(sb => {
    if (sb.ex.id === ex.id) return;
    getHistory(sb.ex.id).forEach(h => {
      if (h.assisted || (h.opt || 0) !== sb.idx) return;
      out.push(Object.assign({}, h, { _fromLevel: sb.ex.level }));
    });
  });
  return out;
}

function effectiveHistory(ex) { return slotHistory(ex, 0); }

function slotStatus(ex, idx) {
  const sl = ex._slots[idx];
  return computeStatus({ target: sl.target, unit: sl.unit }, slotHistory(ex, idx));
}

// Whole-exercise status: either option completing it is enough.
function exerciseStatus(ex) {
  const sts = ex._slots.map((_, i) => slotStatus(ex, i));
  if (sts.length === 1) return sts[0];
  const pick = c => sts.find(st => st.cls === c);
  return pick("yes") || pick("progress") || pick("not-yet") || pick("bad") || sts[0];
}

function refreshSiblings(ex) {
  const seen = {};
  ex._slots.forEach(slot => {
    (FAMILIES[slot.fam] || []).forEach(sb => {
      if (sb.ex.id !== ex.id && !seen[sb.ex.id]) { seen[sb.ex.id] = true; refreshRow(sb.ex); }
    });
  });
}

function bestOf(history, assistedOnly) {
  let best = null;
  history.forEach(h => {
    if (assistedOnly !== undefined && !!h.assisted !== assistedOnly) return;
    const n = Number(h.value);
    if (!Number.isNaN(n)) {
      if (best === null || n > best) best = n;
    }
  });
  return best;
}

function computeStatus(ex, history) {
  if (!history.length) return { cls: "empty", label: "\u2014" };
  const bestUnassisted = bestOf(history, false);
  const assistedEntries = history.filter(h => h.assisted);

  if (ex.target === null || ex.target === undefined) {
    const hasUnassisted = history.some(h => !h.assisted && h.value !== "" && h.value !== undefined && h.value !== null);
    if (hasUnassisted) return { cls: "yes", label: "Yes" };
    if (assistedEntries.length) return { cls: "progress", label: "In progress" };
    return { cls: "bad", label: "Check entry" };
  }

  if (bestUnassisted !== null && bestUnassisted >= ex.target) return { cls: "yes", label: "Yes" };
  if (assistedEntries.length) return { cls: "progress", label: "In progress" };

  const unassistedEntries = history.filter(h => !h.assisted);
  if (unassistedEntries.length && bestUnassisted === null) return { cls: "bad", label: "Check entry" };
  if (bestUnassisted !== null) return { cls: "not-yet", label: "Not yet" };
  return { cls: "empty", label: "\u2014" };
}

function levelExercises(level) {
  return EXERCISES.filter(e => e.level === level && e.gender === gender);
}

function levelsForGender() {
  const levels = new Set(EXERCISES.filter(e => e.gender === gender).map(e => e.level));
  return Array.from(levels).sort((a, b) => a - b);
}

function setGender(g) {
  gender = g;
  localStorage.setItem(GENDER_KEY, g);
  document.getElementById("genderGate").style.display = "none";
  document.getElementById("genderSwitchBtn").textContent = (g === "M") ? "Male" : "Female";
  currentLevel = levelsForGender()[0] || 1;
  renderAll();
}

function renderLevelNav() {
  const nav = document.getElementById("levelNav");
  nav.innerHTML = "";
  levelsForGender().forEach(lvl => {
    const btn = document.createElement("button");
    btn.style.setProperty("--dotcolor", LEVEL_COLORS[lvl]);
    if (lvl === currentLevel) btn.classList.add("active");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = LEVEL_COLORS[lvl];
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode("Level " + lvl));
    btn.addEventListener("click", () => { currentLevel = lvl; renderAll(); });
    nav.appendChild(btn);
  });
}

function fmtDate(d) {
  if (!d) return "";
  const parts = d.split("-");
  if (parts.length !== 3) return d;
  // stored as yyyy-mm-dd -> display as dd/mm/yy
  return parts[2] + "/" + parts[1] + "/" + parts[0].slice(2);
}

function renderHistoryList(container, ex) {
  container.innerHTML = "";
  const history = getHistory(ex.id).slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  if (!history.length) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = "No results logged yet.";
    container.appendChild(empty);
    return;
  }
  history.forEach((h) => {
    const realIndex = getHistory(ex.id).indexOf(h);
    const item = document.createElement("div");
    item.className = "history-item";

    const dateEl = document.createElement("span");
    dateEl.className = "h-date";
    dateEl.textContent = fmtDate(h.date);
    item.appendChild(dateEl);

    const valEl = document.createElement("span");
    const n = Number(h.value);
    const hSlot = ex._slots[h.opt || 0] || ex._slots[0];
    const bestForType = bestOf(getHistory(ex.id).filter(x => (x.opt || 0) === (h.opt || 0)), !!h.assisted);
    const isBest = !Number.isNaN(n) && bestForType !== null && n === bestForType;
    valEl.className = "h-val" + (isBest ? " h-best" : "");
    valEl.textContent = qty(h.value, hSlot.unit);
    item.appendChild(valEl);

    const notesEl = document.createElement("span");
    notesEl.className = "h-notes";
    if (ex._slots.length > 1) {
      const optTag = document.createElement("span");
      optTag.className = "h-tag";
      optTag.textContent = pretty(hSlot.label);
      notesEl.appendChild(optTag);
    }
    if (h.assisted) {
      const tag = document.createElement("span");
      tag.className = "h-tag";
      tag.textContent = "Assisted" + (h.assistedWith ? ": " + h.assistedWith : "");
      notesEl.appendChild(tag);
    }
    if (h.notes) {
      const notesText = document.createElement("span");
      notesText.className = "h-notes-text";
      notesText.textContent = h.notes;
      notesEl.appendChild(notesText);
    }
    item.appendChild(notesEl);

    const delBtn = document.createElement("button");
    delBtn.textContent = "\u2715";
    delBtn.title = "Delete entry";
    delBtn.addEventListener("click", () => {
      const hist = getHistory(ex.id);
      hist.splice(realIndex, 1);
      state[ex.id] = { history: hist };
      saveState();
      refreshRow(ex);
      refreshSiblings(ex);
    });
    item.appendChild(delBtn);

    container.appendChild(item);
  });
}

function refreshRow(ex) {
  const row = document.querySelector('.ex-row[data-id="' + ex.id + '"]');
  if (!row) return;
  const status = exerciseStatus(ex);
  const pill = row.querySelector(".status-pill");
  pill.className = "status-pill " + status.cls;
  pill.textContent = status.label;

  const target = row.querySelector(".ex-target");
  target.innerHTML = targetBlock(ex);

  const histContainer = row.querySelector(".history-list");
  if (histContainer) renderHistoryList(histContainer, ex);

  renderProgress();
}

function targetHtml(ex, history) {
  const bestUnassisted = bestOf(history, false);
  const bestAssisted = bestOf(history, true);
  const goalPart = (ex.target !== null && ex.target !== undefined)
    ? "Goal: " + qty(ex.target, ex.unit)
    : "Goal: pass/fail";
  let extra = "";
  if (bestUnassisted !== null) {
    const bestEntry = history.find(h => !h.assisted && Number(h.value) === bestUnassisted);
    const fromNote = (bestEntry && bestEntry._fromLevel)
      ? " <span class=\"credit-note\">(from Level " + bestEntry._fromLevel + ")</span>" : "";
    extra += " &middot; Best: <b>" + qty(bestUnassisted, ex.unit) + "</b>" + fromNote;
  }
  if (bestAssisted !== null) {
    extra += " &middot; Assisted best: <b class=\"assisted-best\">" + qty(bestAssisted, ex.unit) + "</b>";
  }
  return goalPart + extra;
}

function escHtml(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function targetBlock(ex) {
  if (ex._slots.length === 1) return targetHtml(ex, slotHistory(ex, 0));
  let out = '<div class="opt-hint">Either one counts</div>';
  ex._slots.forEach((slot, i) => {
    const hist = slotHistory(ex, i);
    const st = computeStatus({ target: slot.target, unit: slot.unit }, hist);
    const mark = st.cls === "yes" ? "✓" : (st.cls === "progress" ? "◐" : "○");
    const best = bestOf(hist, false);
    const bestA = bestOf(hist, true);
    let line = '<div class="opt-line ' + st.cls + '"><span class="opt-mark">' + mark + '</span> ' + escHtml(pretty(slot.label));
    if (best !== null) {
      const be = hist.find(h => !h.assisted && Number(h.value) === best);
      line += ' &middot; Best: <b>' + qty(best, slot.unit) + '</b>' +
        ((be && be._fromLevel) ? ' <span class="credit-note">(from Level ' + be._fromLevel + ')</span>' : '');
    }
    if (bestA !== null) {
      line += ' &middot; Assisted best: <b class="assisted-best">' + qty(bestA, slot.unit) + '</b>';
    }
    out += line + '</div>';
  });
  return out;
}

function exRow(ex) {
  const status = exerciseStatus(ex);

  const row = document.createElement("div");
  row.className = "ex-row" + (openRows[ex.id] ? " open" : "");
  row.dataset.id = ex.id;
  row.style.setProperty("--rowcolor", LEVEL_COLORS[ex.level]);

  const main = document.createElement("div");
  main.className = "ex-main";
  main.addEventListener("click", () => {
    row.classList.toggle("open");
    openRows[ex.id] = row.classList.contains("open");
  });

  const iconWrap = document.createElement("div");
  iconWrap.innerHTML = ICONS[ex.icon] || ICONS.generic;
  main.appendChild(iconWrap);

  const textWrap = document.createElement("div");
  const t = document.createElement("div");
  t.className = "ex-text";
  t.textContent = pretty(ex.text);
  textWrap.appendChild(t);
  const target = document.createElement("div");
  target.className = "ex-target";
  target.innerHTML = targetBlock(ex);
  textWrap.appendChild(target);
  main.appendChild(textWrap);

  const controls = document.createElement("div");
  controls.className = "ex-controls";
  const pill = document.createElement("span");
  pill.className = "status-pill " + status.cls;
  pill.textContent = status.label;
  controls.appendChild(pill);
  const caret = document.createElement("span");
  caret.className = "ex-caret";
  caret.textContent = "\u25BE";
  controls.appendChild(caret);
  main.appendChild(controls);

  row.appendChild(main);

  const more = document.createElement("div");
  more.className = "ex-more";

  const form = document.createElement("div");
  form.className = "log-form";

  let selOpt = 0;
  const valLabel = document.createElement("label");
  function updateValLabel() {
    valLabel.innerHTML = 'Result (' + (unitName(ex._slots[selOpt].unit, 2) || "n/a") + ')' + (ex.passfail ? ' &middot; 0.5 = half' : '');
  }
  if (ex._slots.length > 1) {
    const optField = document.createElement("div");
    optField.className = "log-field opt-select";
    optField.innerHTML = '<label>Which option did you do?</label>';
    const optWrap = document.createElement("div");
    optWrap.className = "opt-buttons";
    ex._slots.forEach((slot, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = pretty(slot.label);
      if (i === 0) b.classList.add("active");
      b.addEventListener("click", () => {
        selOpt = i;
        optWrap.querySelectorAll("button").forEach((x, j) => x.classList.toggle("active", j === i));
        updateValLabel();
      });
      optWrap.appendChild(b);
    });
    optField.appendChild(optWrap);
    form.appendChild(optField);
  }

  const valField = document.createElement("div");
  valField.className = "log-field value";
  updateValLabel();
  valField.appendChild(valLabel);
  const valInput = document.createElement("input");
  valInput.type = "number";
  valInput.step = "any";
  valInput.inputMode = "decimal";
  valField.appendChild(valInput);
  form.appendChild(valField);

  const dateField = document.createElement("div");
  dateField.className = "log-field date";
  dateField.innerHTML = '<label>Date</label>';
  let selDate = todayParts();
  const dateBtn = document.createElement("button");
  dateBtn.type = "button";
  dateBtn.className = "date-btn";
  function updateDateBtn() {
    dateBtn.textContent = String(selDate.d).padStart(2, "0") + "/" + String(selDate.m).padStart(2, "0") + "/" + selDate.y;
  }
  updateDateBtn();
  dateBtn.addEventListener("click", () => {
    openCalendarPicker(selDate.y, selDate.m, selDate.d, (d, m, y) => {
      selDate = { d, m, y };
      updateDateBtn();
    });
  });
  dateField.appendChild(dateBtn);
  form.appendChild(dateField);

  const notesField = document.createElement("div");
  notesField.className = "log-field notes";
  notesField.innerHTML = '<label>Notes (optional)</label>';
  const notesInput = document.createElement("input");
  notesInput.type = "text";
  notesInput.placeholder = "Form cues, etc...";
  notesField.appendChild(notesInput);
  form.appendChild(notesField);

  const assistedField = document.createElement("div");
  assistedField.className = "log-field assisted";
  const assistedCheckbox = document.createElement("input");
  assistedCheckbox.type = "checkbox";
  assistedCheckbox.id = "assisted-" + ex.id;
  const assistedLabel = document.createElement("label");
  assistedLabel.setAttribute("for", assistedCheckbox.id);
  assistedLabel.textContent = "Assisted";
  assistedField.appendChild(assistedCheckbox);
  assistedField.appendChild(assistedLabel);
  form.appendChild(assistedField);

  const assistedWithField = document.createElement("div");
  assistedWithField.className = "log-field notes";
  assistedWithField.innerHTML = '<label>Assisted with (optional)</label>';
  const assistedWithInput = document.createElement("input");
  assistedWithInput.type = "text";
  assistedWithInput.placeholder = "e.g. yellow band";
  assistedWithField.appendChild(assistedWithInput);
  form.appendChild(assistedWithField);

  const addBtn = document.createElement("button");
  addBtn.textContent = "Add";
  addBtn.type = "button";
  addBtn.addEventListener("click", () => {
    if (valInput.value === "") { valInput.focus(); return; }
    const isoDate = partsToIso(selDate.d, selDate.m, selDate.y);
    const hist = getHistory(ex.id);
    hist.push({
      value: valInput.value,
      date: isoDate,
      notes: notesInput.value,
      assisted: assistedCheckbox.checked,
      assistedWith: assistedCheckbox.checked ? assistedWithInput.value : "",
      opt: selOpt
    });
    state[ex.id] = { history: hist };
    saveState();
    valInput.value = "";
    notesInput.value = "";
    selDate = todayParts();
    updateDateBtn();
    assistedCheckbox.checked = false;
    assistedWithInput.value = "";
    refreshRow(ex);
    refreshSiblings(ex);
  });
  form.appendChild(addBtn);

  more.appendChild(form);

  const histTitle = document.createElement("div");
  histTitle.className = "history-title";
  histTitle.textContent = "History (most recent first)";
  more.appendChild(histTitle);

  const histList = document.createElement("div");
  histList.className = "history-list";
  more.appendChild(histList);

  row.appendChild(more);
  renderHistoryList(histList, ex);

  return row;
}

function renderProgress() {
  const exs = levelExercises(currentLevel);
  let done = 0;
  exs.forEach(ex => {
    if (exerciseStatus(ex).cls === "yes") done++;
  });
  const lp = document.getElementById("levelProgressText");
  if (lp) lp.innerHTML = "<b>" + done + " / " + exs.length + "</b> goals achieved in Level " + currentLevel;
  const bar = document.getElementById("levelProgressBar");
  if (bar) bar.style.width = (exs.length ? (100 * done / exs.length) : 0) + "%";
}

function normText(t) {
  return t.toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ").trim();
}

function searchMatches(ex, q) {
  const hay = normText(ex.text + " " + pretty(ex.text));
  const tokens = q.split(" ").filter(Boolean);
  if (tokens.every(tok => hay.includes(tok))) return true;
  return hay.replace(/ /g, "").includes(q.replace(/ /g, ""));   // "pullup" finds "Pull ups"
}

function renderSearchResults(app) {
  const q = normText(searchQuery);
  const results = EXERCISES.filter(e => e.gender === gender && searchMatches(e, q));
  const info = document.createElement("div");
  info.className = "search-info";
  info.textContent = results.length
    ? results.length + (results.length === 1 ? " exercise found" : " exercises found") + " for “" + searchQuery.trim() + "”"
    : "No exercise found for “" + searchQuery.trim() + "”";
  app.appendChild(info);

  let lastLevel = null;
  results.forEach(ex => {
    if (ex.level !== lastLevel) {
      lastLevel = ex.level;
      const title = document.createElement("div");
      title.className = "group-title";
      title.textContent = "Level " + ex.level;
      title.style.color = LEVEL_COLORS[ex.level];
      app.appendChild(title);
    }
    const row = exRow(ex);
    if (results.length === 1) row.classList.add("open");
    app.appendChild(row);
  });
}

function renderAll() {
  const searching = normText(searchQuery) !== "";
  document.getElementById("levelNav").style.display = searching ? "none" : "";
  const app = document.getElementById("app");
  if (searching) {
    app.innerHTML = "";
    renderSearchResults(app);
    return;
  }
  renderLevelNav();
  app.innerHTML = "";

  const progressLine = document.createElement("div");
  progressLine.className = "level-progress";
  progressLine.innerHTML = '<span id="levelProgressText"></span>';
  app.appendChild(progressLine);

  const barWrap = document.createElement("div");
  barWrap.className = "level-bar";
  barWrap.innerHTML = '<div id="levelProgressBar" style="width:0%"></div>';
  app.appendChild(barWrap);

  const exs = levelExercises(currentLevel);
  ["Conditioning", "Skills"].forEach(cat => {
    const items = exs.filter(e => e.category === cat);
    if (!items.length) return;
    const title = document.createElement("div");
    title.className = "group-title";
    title.textContent = cat;
    app.appendChild(title);
    items.forEach(ex => app.appendChild(exRow(ex)));
  });

  renderProgress();
}

document.getElementById("pickFemale").addEventListener("click", () => setGender("F"));
document.getElementById("genderSwitchBtn").addEventListener("click", () => {
  setGender(gender === "M" ? "F" : "M");
});

function listLine(ex) {
  const st = exerciseStatus(ex);
  const mark = st.cls === "yes" ? "[x]" : (st.cls === "progress" ? "[~]" : "[ ]");
  const name = pretty(ex.text);
  function summary(idx) {
    const slot = ex._slots[idx];
    const hist = slotHistory(ex, idx);
    const best = bestOf(hist, false);
    const bestA = bestOf(hist, true);
    const parts = [];
    if (best !== null) {
      const e = hist.filter(h => !h.assisted && Number(h.value) === best)
                    .sort((a, b) => (a._fromLevel ? 1 : 0) - (b._fromLevel ? 1 : 0) || (a.date < b.date ? 1 : -1))[0];
      parts.push("best " + qty(best, slot.unit) + (e && e.date ? " on " + fmtDate(e.date) : "") +
                 (e && e._fromLevel ? " (from Level " + e._fromLevel + ")" : ""));
    }
    if (bestA !== null) parts.push("assisted best " + qty(bestA, slot.unit));
    return parts.length ? parts.join(", ") : "not logged yet";
  }
  if (ex._slots.length === 1) {
    const goalNote = /^\d/.test(ex.text) ? "" : " (goal: " + qty(ex.target, ex.unit) + ")";
    return mark + " " + name + goalNote + " - " + summary(0);
  }
  let out = mark + " " + name + "  [either one counts]";
  ex._slots.forEach((slot, i) => {
    const sl = slotStatus(ex, i).cls === "yes" ? " - DONE" : "";
    out += "\n      - " + pretty(slot.label) + ": " + summary(i) + sl;
  });
  return out;
}

function buildProgressList() {
  const d = new Date();
  const dateTxt = String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
  const lvls = levelsForGender();
  const out = [];
  out.push("KALISTENIKA - PROGRESS LIST");
  out.push("Profile: " + (gender === "M" ? "Male" : "Female"));
  out.push("Date: " + dateTxt);
  out.push("");
  out.push("[x] goal achieved    [~] in progress (assisted)    [ ] not yet / not logged");
  out.push("");
  out.push("SUMMARY");
  lvls.forEach(lvl => {
    const exs = levelExercises(lvl);
    const done = exs.filter(e => exerciseStatus(e).cls === "yes").length;
    out.push("  Level " + lvl + ": " + done + " of " + exs.length + " goals achieved");
  });
  lvls.forEach(lvl => {
    const exs = levelExercises(lvl);
    const done = exs.filter(e => exerciseStatus(e).cls === "yes").length;
    out.push("");
    out.push("LEVEL " + lvl + " (" + done + " of " + exs.length + " goals achieved)");
    ["Conditioning", "Skills"].forEach(cat => {
      const items = exs.filter(e => e.category === cat);
      if (!items.length) return;
      out.push("  " + cat);
      items.forEach(e => out.push("  " + listLine(e).replace(/\n/g, "\n  ")));
    });
  });
  return out.join("\n") + "\n";
}

document.getElementById("exportListBtn").addEventListener("click", () => {
  const blob = new Blob([buildProgressList()], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "kalistenika-progress-" + (gender === "M" ? "male" : "female") + "-" + todayStr() + ".txt";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const payload = { gender: gender, data: state };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "kalistenika-beta-backup.json";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("fileInput").click();
});

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (imported && imported.data) {
        state = imported.data || {};
        if (imported.gender) {
          gender = imported.gender;
          localStorage.setItem(GENDER_KEY, gender);
          document.getElementById("genderSwitchBtn").textContent = (gender === "M") ? "Male" : "Female";
        }
      } else {
        state = imported || {};
      }
      saveState();
      renderAll();
    } catch (err) {
      alert("Couldn't read that file - make sure it's a backup exported from this app.");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("Clear all logged history for the current profile? This can't be undone.")) {
    state = {};
    saveState();
    renderAll();
  }
});

const searchInput = document.getElementById("searchInput");
const searchWrap = document.getElementById("searchWrap");
searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value;
  searchWrap.classList.toggle("has-text", searchQuery !== "");
  if (gender === "M" || gender === "F") renderAll();
});
document.getElementById("searchClear").addEventListener("click", () => {
  searchInput.value = "";
  searchQuery = "";
  searchWrap.classList.remove("has-text");
  if (gender === "M" || gender === "F") renderAll();
  searchInput.focus();
});

// Init
if (gender === "M" || gender === "F") {
  document.getElementById("genderGate").style.display = "none";
  document.getElementById("genderSwitchBtn").textContent = (gender === "M") ? "Male" : "Female";
  currentLevel = levelsForGender()[0] || 1;
  renderAll();
} else {
  document.getElementById("genderSwitchBtn").style.display = "none";
}
</script>
</body>
</html>
